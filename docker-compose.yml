services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_rx
      POSTGRES_PASSWORD: voice_rx
      POSTGRES_DB: voice_prescriptions
    volumes:
      - voice_rx_pg:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_rx -d voice_prescriptions"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: postgresql://voice_rx:voice_rx@db:5432/voice_prescriptions
      UPLOAD_DIR: /app/uploads
      PDF_OUTPUT_DIR: /app/pdf_output
      FRONTEND_URL: http://localhost
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    volumes:
      - voice_rx_uploads:/app/uploads
      - voice_rx_pdf:/app/pdf_output
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  voice_rx_pg:
  voice_rx_uploads:
  voice_rx_pdf:
